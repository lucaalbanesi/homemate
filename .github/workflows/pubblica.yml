name: Pubblica HomeMate
# Pubblica il sito su GitHub Pages e aggiorna le notizie. Gira a ogni modifica e ogni 30 minuti.
# (Il cron di GitHub a volte ritarda o salta un giro: per le notizie va bene.)
on:
  push:
    branches: [main]
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Test
        run: node scripts/test.mjs
      - name: Prepara il sito
        run: |
          mkdir -p _site/data
          cp -r app/* _site/
          sed -i "s/homemate-v1/homemate-${GITHUB_SHA::7}/" _site/sw.js
      - name: Notizie ANSA
        # se ANSA non risponde si pubblica lo stesso: la pagina mostra "notizie non disponibili"
        continue-on-error: true
        run: node scripts/news.mjs _site/data/news.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
