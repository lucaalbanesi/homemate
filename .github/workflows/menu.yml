name: Menu mensa
# Una volta al giorno, nei giorni di scuola, scarica il menu dei prossimi giorni e lo salva in data/menu.json.
# Solo per le scuole elencate in config/mensa.json. Riparte anche quando cambia quel file.
on:
  schedule:
    - cron: "23 4 * * 1-5"
  push:
    branches: [main]
    paths: ["config/mensa.json", "scripts/menu.mjs"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: menu
  cancel-in-progress: true

jobs:
  menu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Scarica il menu
        run: node scripts/menu.mjs data/menu.json
      - name: Salva se è cambiato
        run: |
          [ -f data/menu.json ] || exit 0
          git add data/menu.json
          if git diff --cached --quiet; then echo "Menu invariato"; exit 0; fi
          git -c user.name="homemate-bot" -c user.email="actions@users.noreply.github.com" commit -m "Menu mensa aggiornato"
          git push
